<div class="edunova-nuevo" data-nuevo-calendario>
  <div class="edunova-nuevo-acciones" role="group" aria-label="Crear actividad académica">
    <button type="button" class="btn-primary edunova-nuevo-trigger" data-crear-tipo="reunion">+ Reunión</button>
    <button type="button" class="btn-secondary edunova-nuevo-trigger" data-crear-tipo="otro">+ Evento</button>
    {% if not es_director %}<button type="button" class="btn-secondary edunova-nuevo-trigger" data-crear-tipo="evaluacion">+ Evaluación</button>{% endif %}
  </div>
  <dialog class="edunova-nuevo-modal" aria-labelledby="edunova-nuevo-titulo">
    <form method="post" action="{% url 'academico:crear_evento' %}" class="space-y-3">
      {% csrf_token %}
      <input type="hidden" name="tipo" value="reunion" data-tipo-input>
      <div class="flex items-start justify-between gap-3">
        <div><p class="text-sm text-muted">Mi agenda personal</p>
          <h3 id="edunova-nuevo-titulo" data-titulo-modal class="font-display text-xl font-semibold">Nueva reunión</h3></div>
        <button type="button" class="btn-secondary px-3 py-1" data-cerrar-nuevo aria-label="Cerrar ventana">✕</button>
      </div>
      <p class="text-sm text-muted">Esta actividad aparecerá únicamente en tu calendario.</p>
      <label class="block text-sm">Título<input name="titulo" maxlength="150" required class="surface-control border rounded-lg w-full p-2 mt-1"></label>
      <label class="block text-sm">Descripción (opcional)<textarea name="descripcion" rows="2" class="surface-control border rounded-lg w-full p-2 mt-1"></textarea></label>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <label class="text-sm">Fecha<input type="date" name="fecha" required class="surface-control border rounded-lg w-full p-2 mt-1"></label>
        <label class="text-sm">Hora de inicio<input type="time" name="hora_inicio" class="surface-control border rounded-lg w-full p-2 mt-1"></label>
        <label class="text-sm">Hora de término<input type="time" name="hora_fin" class="surface-control border rounded-lg w-full p-2 mt-1"></label>
      </div>
      <div class="flex justify-end gap-2 pt-2"><button type="button" data-cerrar-nuevo class="btn-secondary px-4 py-2">Cancelar</button>
        <button type="submit" class="btn-primary px-4 py-2">Guardar actividad</button></div>
    </form>
  </dialog>
</div>
