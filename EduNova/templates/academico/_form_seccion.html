{% load static %}
<form id="form-seccion" method="post" action="{% url 'academico:crear_curso' %}" data-opciones-url="{% url 'academico:opciones_seccion' %}" class="space-y-4">
{% csrf_token %}{{ form.non_field_errors }}
{% for campo in form %}<div><label for="{{ campo.id_for_label }}" class="block text-sm font-medium mb-1">{{ campo.label }}</label>{{ campo }}{{ campo.errors }}</div>{% endfor %}
<div><label class="block text-sm font-medium mb-1" for="numero-seccion">Número de sección (automático)</label><input id="numero-seccion" name="numero_previo" value="{{ form.numero_seccion }}" readonly class="surface-control rounded-lg border p-3 w-full" placeholder="000" aria-describedby="ayuda-numero"><p id="ayuda-numero" class="text-xs text-muted mt-1">Se asigna entre 000 y 999. El número se confirma al guardar.</p></div>
<p id="codigo-seccion" class="font-semibold" aria-live="polite">{{ form.codigo_seccion|default:"Selecciona una carrera y una asignatura." }}</p>
<p id="error-seccion" class="text-sm text-error" role="alert">{{ form.error_numero }}</p>
<button type="submit" class="btn-primary w-full py-3" id="guardar-seccion">Crear sección</button>
</form>

<script src="{% static 'js/secciones-form.js' %}" defer></script>
